{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="registration-form">
                <h2>Register</h2>
                <form method="post" id="register-form" class = "sign-up-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-lg mt-3">Register</button>
                </form>
                <p>Already have an account? <a href="{% url 'accounts:login' %}">Login here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
