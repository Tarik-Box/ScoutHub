<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ScoutHub{% endblock %}</title>
    {# CSS/JS #}
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            {# Add more navigation links here later #}
        </nav>
    </header>

    <main>
        {% block content %}
            {# content  #}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} ScoutHub</p>
    </footer>

    {# Js #}
    {% block extra_body %}{% endblock %}
</body>
</html>
